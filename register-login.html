<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login / Register</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/style/custom.css" />
  </head>

  <body>
    <div class="auth">
      <div class="card m-3 m-md-0">
        <div class="row g-0">
          <!-- Slideshow Section -->
          <div class="col-md-6 d-none d-md-block">
            <div
              id="carouselExampleFade"
              class="carousel slide carousel-fade h-100"
              data-bs-ride="carousel"
            >
              <div class="carousel-inner h-100">
                <div class="carousel-item active h-100">
                  <img
                    src="./assets/images/c0127876-d771-43ec-bb09-6a34b783be42.png"
                    class="d-block w-100 h-100 object-fit-cover"
                    alt="slide-1"
                  />
                  <div class="carousel-caption d-none d-md-block">
                    <h5>Imrpove your persona</h5>
                  </div>
                </div>
                <div class="carousel-item h-100">
                  <img
                    src="./assets/images/0eea0cf2-8bb4-465f-a18b-425b554d5ec5.png"
                    class="d-block w-100 h-100 object-fit-cover"
                    alt="slide-2"
                  />
                  <div class="carousel-caption d-none d-md-block">
                    <h5>Customize</h5>
                  </div>
                </div>
                <div class="carousel-item h-100">
                  <img
                    src="./assets/images/705d9a37-4fc1-4bdc-9f83-9240cdfde0dd.png"
                    class="d-block w-100 h-100 object-fit-cover"
                    alt="slide-3"
                  />
                  <div class="carousel-caption d-none d-md-block">
                    <h5>Live clothes</h5>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Form Section -->
          <div class="col-md-6 bg-white">
            <div class="form-section">
              <!-- Nav tabs -->
              <!-- Nav tabs -->
              <div class="position-relative">
                <ul
                  class="nav nav-tabs justify-content-center border-0 position-relative"
                  id="loginRegisterTab"
                  role="tablist"
                >
                  <li class="nav-item" role="presentation">
                    <button
                      class="nav-link text-black active bg-transparent border-0"
                      id="login-tab"
                      data-bs-toggle="tab"
                      data-bs-target="#login"
                      type="button"
                      role="tab"
                    >
                      Login
                    </button>
                  </li>
                  <li class="nav-item" role="presentation">
                    <button
                      class="nav-link text-black bg-transparent border-0"
                      id="register-tab"
                      data-bs-toggle="tab"
                      data-bs-target="#register"
                      type="button"
                      role="tab"
                    >
                      Register
                    </button>
                  </li>
                </ul>
                <!-- underline -->
                <div
                  id="tab-underline"
                  class="position-absolute bg-dark"
                  style="height: 2px; bottom: 0; transition: all 0.3s ease"
                ></div>
              </div>

              <!-- Tab Content -->
              <div class="tab-content mt-4">
                <!-- Login Form -->
                <div
                  class="tab-pane fade show active"
                  id="login"
                  role="tabpanel"
                >
                  <form>
                    <div class="form-floating mb-3">
                      <input
                        type="email"
                        class="form-control"
                        id="loginEmail"
                        placeholder="name@example.com"
                      />
                      <label for="loginEmail">Email address</label>
                    </div>
                    <div class="form-floating mb-4">
                      <input
                        type="password"
                        class="form-control"
                        id="loginPassword"
                        placeholder="Password"
                      />
                      <label for="loginPassword">Password</label>
                    </div>
                    <div class="d-grid">
                      <button type="submit" class="btn btn-dark">Login</button>
                    </div>
                  </form>
                </div>

                <!-- Register Form -->
                <div class="tab-pane fade" id="register" role="tabpanel">
                  <form>
                    <div class="form-floating mb-3">
                      <input
                        type="text"
                        class="form-control"
                        id="registerName"
                        placeholder="Full Name"
                      />
                      <label for="registerName">Full Name</label>
                    </div>
                    <div class="form-floating mb-3">
                      <input
                        type="email"
                        class="form-control"
                        id="registerEmail"
                        placeholder="name@example.com"
                      />
                      <label for="registerEmail">Email address</label>
                    </div>
                    <div class="form-floating mb-4">
                      <input
                        type="password"
                        class="form-control"
                        id="registerPassword"
                        placeholder="Password"
                      />
                      <label for="registerPassword">Password</label>
                    </div>
                    <div class="d-grid">
                      <button type="submit" class="btn btn-dark">
                        Register
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./assets/js/auth-carousel.js"></script>
  </body>
</html>
