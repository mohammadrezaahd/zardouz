<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Support Tickets Management</title>

    <!-- Bootstrap 5.3.3 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- FontAwesome 6.6.0 -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container py-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Support Tickets</h2>
        <button
          class="btn btn-primary"
          data-bs-toggle="modal"
          data-bs-target="#newTicketModal"
        >
          <i class="fa-solid fa-plus"></i> New Ticket
        </button>
      </div>

      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead class="table-light">
            <tr>
              <th scope="col">Title</th>
              <th scope="col">Subject</th>
              <th scope="col">Status</th>
            </tr>
          </thead>
          <tbody>
            <!-- Example Ticket Row -->
            <tr>
              <td>Order Delay Issue</td>
              <td>
                <a
                  href="#"
                  class="text-decoration-none"
                  data-bs-toggle="modal"
                  data-bs-target="#chatModal"
                  >Order Follow-up</a
                >
              </td>
              <td><span class="badge bg-warning">Pending</span></td>
            </tr>
            <tr>
              <td>Custom Request</td>
              <td>
                <a
                  href="#"
                  class="text-decoration-none"
                  data-bs-toggle="modal"
                  data-bs-target="#chatModal"
                  >Customization</a
                >
              </td>
              <td><span class="badge bg-success">Resolved</span></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Chat Modal -->
    <div
      class="modal fade"
      id="chatModal"
      tabindex="-1"
      aria-labelledby="chatModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-scrollable modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="chatModalLabel">Ticket Conversation</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <!-- Chat Messages -->
            <div class="d-flex flex-column gap-3">
              <!-- Incoming Message -->
              <div class="d-flex align-items-start">
                <img
                  src="https://via.placeholder.com/40"
                  class="rounded-circle me-3"
                  alt="User"
                />
                <div class="bg-light p-3 rounded">
                  <p class="mb-1">
                    <strong>User:</strong> I have an issue with my order.
                  </p>
                  <small class="text-muted">2 hours ago</small>
                </div>
              </div>

              <!-- Reply Message -->
              <div class="d-flex align-items-start flex-row-reverse">
                <img
                  src="https://via.placeholder.com/40"
                  class="rounded-circle ms-3"
                  alt="Support"
                />
                <div class="bg-primary text-white p-3 rounded">
                  <p class="mb-1">
                    <strong>Support:</strong> We are checking it right now!
                  </p>
                  <small class="text-white-50">1 hour ago</small>
                </div>
              </div>

              <!-- Incoming Message -->
              <div class="d-flex align-items-start">
                <img
                  src="https://via.placeholder.com/40"
                  class="rounded-circle me-3"
                  alt="User"
                />
                <div class="bg-light p-3 rounded">
                  <p class="mb-1"><strong>User:</strong> Thank you!</p>
                  <small class="text-muted">30 minutes ago</small>
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <input
              type="text"
              class="form-control"
              placeholder="Type your message..."
            />
            <button class="btn btn-primary">
              <i class="fa-solid fa-paper-plane"></i> Send
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- New Ticket Modal -->
    <div
      class="modal fade"
      id="newTicketModal"
      tabindex="-1"
      aria-labelledby="newTicketModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <form class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="newTicketModalLabel">
              Create New Ticket
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label for="ticketTitle" class="form-label">Title</label>
              <input
                type="text"
                class="form-control"
                id="ticketTitle"
                required
              />
            </div>

            <div class="mb-3">
              <label for="ticketSubject" class="form-label">Subject</label>
              <select class="form-select" id="ticketSubject" required>
                <option selected disabled>Select Subject</option>
                <option>Order Issue</option>
                <option>Order Follow-up</option>
                <option>Support</option>
                <option>Customization</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="ticketMessage" class="form-label">Message</label>
              <textarea
                class="form-control"
                id="ticketMessage"
                rows="4"
                required
              ></textarea>
            </div>

            <div class="mb-3">
              <label for="ticketImage" class="form-label">Upload Image</label>
              <input
                class="form-control"
                type="file"
                id="ticketImage"
                accept="image/*"
              />
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-success">
              <i class="fa-solid fa-paper-plane"></i> Submit Ticket
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Bootstrap 5.3.3 JS Bundle (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
